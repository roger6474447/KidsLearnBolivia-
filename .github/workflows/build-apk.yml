name: Build APK (nube, sin instalar nada)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Quitar local.properties (ruta de tu PC)
        run: rm -f local.properties

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar plataforma y build-tools (usa el SDK preinstalado del runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/cmdline-tools"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.13

      - name: Compilar APK debug
        run: gradle :app:assembleDebug --stacktrace

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: KidsLearnBolivia-debug
          path: app/build/outputs/apk/debug/app-debug.apk
